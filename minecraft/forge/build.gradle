// GENERATED by tools/port-version/port.py for Minecraft 1.8.8 (legacy Forge via Unimined, MCP names) - do not edit by hand.
plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
    id 'maven-publish'
}

def repoRoot = rootProject.file('../..')
def core = ['common', 'network', 'audio', 'svc-compat', 'ui', 'core'].collect { new File(repoRoot, "client/${it}/src/main/java") }

group = project.maven_group
base { archivesName = 'mcvoice' }
version = "${project.mod_version}-mc${project.minecraft_version}-forge"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
}

unimined.minecraft {
    version project.minecraft_version
    mappings {
        searge()
        mcp('stable', '20-1.8.8')
    }
    minecraftForge {
        // Forge's own version without the Minecraft prefix/suffix, e.g. 11.14.4.1563
        loader project.forge_version.substring(project.minecraft_version.length() + 1).replace('-' + project.minecraft_version, '')
    }
}

sourceSets {
    main {
        java.srcDirs += core
        java.srcDirs += file('src-gen/java')
        resources.srcDirs += new File(repoRoot, 'client/common/src/main/resources')
        resources.srcDirs += file('src-gen/resources')
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    // the Java 8 toolchain compiler has no --release; source/target come from the toolchain
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.mod_version, minecraft_version: project.minecraft_version,
                 backendUrl: (project.findProperty('mcvoiceBackendUrl') ?: '')]
    inputs.properties props
    filesMatching(['mcmod.info', 'mcvoice-defaults.properties', 'mcvoice-platform.properties']) { expand props }
    // Minecraft < 1.11 looks up en_US.lang; generated here so the repository has no case-only duplicates
    from(file('src-gen/resources/assets/mcvoice/lang/en_us.lang')) {
        into 'assets/mcvoice/lang'
        rename { 'en_US.lang' }
    }
}

jar {
    from(new File(repoRoot, 'LICENSE')) { rename { 'LICENSE_mcvoice' } }
    from(new File(repoRoot, 'client/audio/src/main/java/dev/mcvoice/thirdparty/concentus/README.md')) { rename { 'THIRD_PARTY_concentus.md' } }
    manifest.attributes('Implementation-Title': 'MCVoice', 'Implementation-Version': project.mod_version)
}

publishing {
    publications {
        mod(MavenPublication) {
            artifactId = 'voice-client-forge'
            version = "${project.mod_version}+mc${project.minecraft_version}"
            artifact(tasks.named('remapJar')) { classifier = null }
            artifact(tasks.named('sourcesJar'))
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY') ?: 'RavoxX/MCVoice'}")
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
