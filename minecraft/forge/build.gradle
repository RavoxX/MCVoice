// GENERATED by tools/port-version/port.py for Minecraft 1.16.2 (Forge, ForgeGradle 5.1.+, official mappings) - do not edit by hand.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'maven-publish'
}

def repoRoot = rootProject.file('../..')
def core = ['common', 'network', 'audio', 'svc-compat', 'ui', 'core'].collect { new File(repoRoot, "client/${it}/src/main/java") }

group = project.maven_group
base { archivesName = 'mcvoice' }
version = "${project.mod_version}-mc${project.minecraft_version}-forge"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs += core
        java.srcDirs += file('src-gen/java')
        resources.srcDirs += new File(repoRoot, 'client/common/src/main/resources')
        resources.srcDirs += file('src-gen/resources')
    }
}

minecraft {
    mappings channel: 'official', version: '1.16.2'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    if (8 > 8) {
        options.release = 8   // a Java 8 toolchain compiler has no --release; it targets 8 anyway
    }
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.mod_version, minecraft_version: project.minecraft_version,
                 forge_major: project.forge_version.split('-')[1].split('\\.')[0],
                 backendUrl: (project.findProperty('mcvoiceBackendUrl') ?: '')]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'mcvoice-defaults.properties', 'mcvoice-platform.properties']) { expand props }
}

jar {
    from(new File(repoRoot, 'LICENSE')) { rename { 'LICENSE_mcvoice' } }
    from(new File(repoRoot, 'client/audio/src/main/java/dev/mcvoice/thirdparty/concentus/README.md')) { rename { 'THIRD_PARTY_concentus.md' } }
    manifest.attributes('Implementation-Title': 'MCVoice', 'Implementation-Version': project.mod_version)
    finalizedBy 'reobfJar'   // the published jar uses the game's runtime (SRG) names
}

publishing {
    publications {
        mod(MavenPublication) {
            artifactId = 'voice-client-forge'
            version = "${project.mod_version}+mc${project.minecraft_version}"
            artifact(tasks.named('jar')) { classifier = null }
            artifact(tasks.named('sourcesJar'))
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY') ?: 'RavoxX/MCVoice'}")
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
