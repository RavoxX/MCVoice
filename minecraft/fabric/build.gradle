// GENERATED by tools/port-version/port.py for Minecraft 1.21.9 (Fabric, obfuscated game remapped with Mojang mappings) - do not edit by hand.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.18.2'
    id 'maven-publish'
}

def repoRoot = rootProject.file('../..')
def core = ['common', 'network', 'audio', 'svc-compat', 'ui', 'core'].collect { new File(repoRoot, "client/${it}/src/main/java") }

group = project.maven_group
base { archivesName = 'mcvoice' }
version = "${project.mod_version}-mc${project.minecraft_version}-fabric"

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs += core
        java.srcDirs += file('src-gen/java')
        resources.srcDirs += new File(repoRoot, 'client/common/src/main/resources')
        resources.srcDirs += file('src-gen/resources')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api}"
}

tasks.withType(JavaCompile).configureEach {
    if (21 > 8) {
        options.release = 21   // a Java 8 toolchain compiler has no --release; it targets 8 anyway
    }
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.mod_version, minecraft_version: project.minecraft_version, minecraft_dep: project.minecraft_version, java: '21',
                 loader_min: project.fabric_loader, fabric_api_id: 'fabric-api', backendUrl: (project.findProperty('mcvoiceBackendUrl') ?: '')]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'mcvoice-defaults.properties', 'mcvoice-platform.properties']) { expand props }
}

jar {
    from(new File(repoRoot, 'LICENSE')) { rename { 'LICENSE_mcvoice' } }
    from(new File(repoRoot, 'client/audio/src/main/java/dev/mcvoice/thirdparty/concentus/README.md')) { rename { 'THIRD_PARTY_concentus.md' } }
}

publishing {
    publications {
        mod(MavenPublication) {
            artifactId = 'voice-client-fabric'
            version = "${project.mod_version}+mc${project.minecraft_version}"
            artifact(tasks.named('remapJar')) { classifier = null }
            artifact(tasks.named('remapSourcesJar')) { classifier = 'sources' }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY') ?: 'RavoxX/MCVoice'}")
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
