// Shared conventions for all client core modules.
subprojects {
    apply plugin: 'java-library'

    group = rootProject.findProperty('maven_group')
    version = rootProject.findProperty('mod_version')

    repositories {
        mavenCentral()
    }

    java {
        // Every module must run on the Java 8 runtimes shipped with Minecraft 1.8-1.16.
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:-options']
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'mcvoice.testVectors', rootProject.file('../protocol/test-vectors').absolutePath
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
    }
}

project(':network') {
    dependencies {
        api project(':common')
        testImplementation project(':common').sourceSets.test.output
    }
}
project(':audio') {
    dependencies {
        api project(':common')
        testImplementation project(':common').sourceSets.test.output
    }
}
project(':svc-compat') {
    dependencies {
        api project(':common')
        api project(':network')
    }
    // tests use lambdas; main code stays Java 8 source compatible
    // classpath for tools/svc-interop (runs the SvcProbe harness against a real SVC server)
    tasks.register('printTestClasspath') {
        dependsOn 'testClasses', sourceSets.test.runtimeClasspath   // builds the project jars on the classpath
        doLast { println sourceSets.test.runtimeClasspath.asPath }
    }
}
project(':ui') { dependencies { api project(':common') } }
project(':core') {
    tasks.withType(Test).configureEach {
        def bin = System.getenv('MCVOICE_BACKEND_BIN') ?: rootProject.findProperty('mcvoiceBackendBin')
        if (bin) {
            systemProperty 'mcvoice.backendBin', bin
        }
        testLogging { events 'failed', 'skipped', 'passed' }
    }
    dependencies {
        api project(':network')
        api project(':audio')
        api project(':svc-compat')
        api project(':ui')
    }
}

project(':common') {
    processResources {
        def url = rootProject.findProperty('mcvoiceBackendUrl') ?: ''
        inputs.property 'backendUrl', url
        filesMatching('mcvoice-defaults.properties') {
            expand(backendUrl: url)
        }
    }
}
