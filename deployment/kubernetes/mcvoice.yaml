# MCVoice backend on Kubernetes (single relay; see docs/backend-deployment.md for scaling).
# kubectl create secret generic mcvoice-secrets \
#   --from-literal=JWT_SIGNING_SECRET=$(openssl rand -base64 48) \
#   --from-literal=SESSION_SECRET=$(openssl rand -base64 48)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcvoice-config
data:
  AUTH_MODE: mojang
  CONTROL_PORT: "8080"
  VOICE_UDP_PORT: "24455"
  PUBLIC_HOSTNAME: voice.example.org
  TRUST_PROXY_HEADERS: "true"
  LOG_LEVEL: info
  LOG_FORMAT: json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcvoice-backend
  labels: {app: mcvoice-backend}
spec:
  replicas: 1   # one relay per voice host; scale by adding relays (docs/backend-deployment.md)
  selector:
    matchLabels: {app: mcvoice-backend}
  template:
    metadata:
      labels: {app: mcvoice-backend}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: ghcr.io/ravoxx/mcvoice/voice-backend-rust:0.1.0
          envFrom:
            - configMapRef: {name: mcvoice-config}
            - secretRef: {name: mcvoice-secrets}
          ports:
            - {name: control, containerPort: 8080, protocol: TCP}
            - {name: voice, containerPort: 24455, protocol: UDP}
          readinessProbe:
            httpGet: {path: /ready, port: control}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: control}
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: mcvoice-control
spec:
  selector: {app: mcvoice-backend}
  ports:
    - {name: control, port: 8080, targetPort: control, protocol: TCP}
---
# Voice UDP must reach the pod directly with a stable public address.
apiVersion: v1
kind: Service
metadata:
  name: mcvoice-voice
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app: mcvoice-backend}
  ports:
    - {name: voice, port: 24455, targetPort: voice, protocol: UDP}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcvoice-control
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [voice.example.org]
      secretName: mcvoice-tls
  rules:
    - host: voice.example.org
      http:
        paths:
          - path: /v1/control
            pathType: Exact
            backend:
              service: {name: mcvoice-control, port: {name: control}}
