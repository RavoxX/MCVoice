// GENERATED by tools/port-version/port.py for Minecraft @MC@ (Legacy Fabric, Legacy Yarn names) - do not edit by hand.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version '@PLUGIN_VERSION@'
    id 'legacy-looming' version '@PLUGIN_VERSION@'   // must match Loom's version
    id 'maven-publish'
}

def repoRoot = rootProject.file('../..')
def core = ['common', 'network', 'audio', 'svc-compat', 'ui', 'core'].collect { new File(repoRoot, "client/${it}/src/main/java") }

group = project.maven_group
base { archivesName = 'mcvoice' }
version = "${project.mod_version}-mc${project.minecraft_version}-legacyfabric"

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(@JAVA@)
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs += core
        java.srcDirs += file('src-gen/java')
        resources.srcDirs += new File(repoRoot, 'client/common/src/main/resources')
        resources.srcDirs += file('src-gen/resources')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings legacy.yarn(project.minecraft_version, '@MAPPINGS@')
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader}"
@LEGACYFABRIC_API_DEP@}

tasks.withType(JavaCompile).configureEach {
    // the Java 8 toolchain compiler has no --release; source/target come from the toolchain
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.mod_version, minecraft_version: project.minecraft_version, minecraft_dep: project.minecraft_version, java: '@JAVA@',
                 loader_min: project.fabric_loader, backendUrl: (project.findProperty('mcvoiceBackendUrl') ?: '')]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'mcvoice-defaults.properties', 'mcvoice-platform.properties']) { expand props }
    // Minecraft < 1.11 looks up en_US.lang; generated here so the repository has no case-only duplicates
    from(file('src-gen/resources/assets/mcvoice/lang/en_us.lang')) {
        into 'assets/mcvoice/lang'
        rename { 'en_US.lang' }
    }
}

jar {
    from(new File(repoRoot, 'LICENSE')) { rename { 'LICENSE_mcvoice' } }
    from(new File(repoRoot, 'client/audio/src/main/java/dev/mcvoice/thirdparty/concentus/README.md')) { rename { 'THIRD_PARTY_concentus.md' } }
}

publishing {
    publications {
        mod(MavenPublication) {
            artifactId = 'voice-client-legacyfabric'
            version = "${project.mod_version}+mc${project.minecraft_version}"
            artifact(tasks.named('remapJar')) { classifier = null }
            artifact(tasks.named('remapSourcesJar')) { classifier = 'sources' }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY') ?: 'RavoxX/MCVoice'}")
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
