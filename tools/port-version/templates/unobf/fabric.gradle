// GENERATED by tools/port-version/port.py for Minecraft @MC@ (Fabric, unobfuscated) - do not edit by hand.
plugins {
    id 'net.fabricmc.fabric-loom' version '@PLUGIN_VERSION@'
    id 'maven-publish'
}

def repoRoot = rootProject.file('..')
def core = ['common', 'network', 'audio', 'svc-compat', 'ui', 'core'].collect { new File(repoRoot, "client/${it}/src/main/java") }

group = project.maven_group
base { archivesName = 'mcvoice' }
version = "${project.mod_version}-mc${project.minecraft_version}-fabric"

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(@JAVA@)
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs += core
        java.srcDirs += new File(repoRoot, 'client/platform/@FAMILY@/common/src/main/java')
        java.srcDirs += [@VARIANT_DIRS@].collect { new File(repoRoot, "client/platform/@FAMILY@/${it}/src/main/java") }
        java.srcDirs += new File(repoRoot, 'client/platform/@FAMILY@/fabric/src/main/java')
        resources.srcDirs += new File(repoRoot, 'client/platform/@FAMILY@/fabric/src/main/resources')
        resources.srcDirs += new File(repoRoot, 'client/common/src/main/resources')
        resources.srcDirs += new File(repoRoot, 'client/platform/@FAMILY@/common/src/main/resources')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = @JAVA@
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.mod_version, minecraft_version: project.minecraft_version, minecraft_dep: project.minecraft_version, java: '@JAVA@',
                 loader_min: project.fabric_loader, backendUrl: (project.findProperty('mcvoiceBackendUrl') ?: '')]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'mcvoice-defaults.properties', 'mcvoice-platform.properties']) { expand props }
}

jar {
    from(new File(repoRoot, 'LICENSE')) { rename { 'LICENSE_mcvoice' } }
    from(new File(repoRoot, 'client/audio/src/main/java/dev/mcvoice/thirdparty/concentus/README.md')) { rename { 'THIRD_PARTY_concentus.md' } }
}

publishing {
    publications {
        mod(MavenPublication) {
            artifactId = 'voice-client-fabric'
            version = "${project.mod_version}+mc${project.minecraft_version}"
            artifact(tasks.named('jar')) { classifier = null }
            artifact(tasks.named('sourcesJar'))
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY') ?: 'RavoxX/MCVoice'}")
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
