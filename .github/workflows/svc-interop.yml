name: svc-interop

# Real-server Simple Voice Chat interoperability check. Starts a Paper server
# with the unmodified Simple Voice Chat plugin (downloaded from Modrinth at
# run time; nothing of it is stored in this repository), joins it with a plain
# protocol bot and lets MCVoice's own svc-compat code (SvcHandshake +
# SvcUdpClient via the SvcProbe harness) request the secret, authenticate over
# UDP, stay connected and send microphone packets. The result (accepted
# compatibility version, cipher construction) is what SvcProtocols.VERIFIED
# may claim.

on:
  workflow_dispatch:
    inputs:
      minecraft:
        description: Paper / Minecraft version for the test server
        default: "1.21.4"
  push:
    branches: [main]
    paths: ["client/svc-compat/**", "client/build.gradle", "tools/svc-interop/**", ".github/workflows/svc-interop.yml"]
  pull_request:
    paths: ["client/svc-compat/**", "client/build.gradle", "tools/svc-interop/**", ".github/workflows/svc-interop.yml"]
  schedule:
    - cron: "17 4 * * 1"   # weekly: catches new SVC releases

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MC: ${{ inputs.minecraft || '1.21.4' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Paper and the Simple Voice Chat plugin
        run: |
          set -euo pipefail
          mkdir -p server/plugins && cd server
          # Paper downloads API (v3 "fill"; v2 as fallback)
          python3 ../tools/svc-interop/download-server.py "$MC"
          svc_ver=$(cat svc-version.txt)
          echo "SVC_VERSION=$svc_ver" >> "$GITHUB_ENV"
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nserver-port=25565\nenforce-secure-profile=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=4\n' > server.properties
      - name: Start server
        working-directory: server
        run: |
          nohup java -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          for i in $(seq 180); do
            grep -q 'Done (' server.log && break
            sleep 1
          done
          grep -q 'Done (' server.log || { tail -80 server.log; echo "::error::server did not start"; exit 1; }
          grep -i voice server.log | tail -20 || true
      - name: Build probe
        working-directory: client
        run: ./gradlew -q :svc-compat:printTestClasspath --no-daemon > ../probe-classpath.txt
      - name: Run the probe
        id: probe
        working-directory: tools/svc-interop
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          cp=$(tail -1 ../../probe-classpath.txt)
          node bot.js 127.0.0.1 25565 "$MC" -- java -cp "$cp" dev.mcvoice.client.svc.tools.SvcProbe 127.0.0.1 90 \
            2> >(tee ../../probe.log >&2) | tee ../../svc-interop-result.json
          python3 reconnect.py "$MC" "$cp" | tee ../../svc-reconnect-result.json
      - name: Report
        if: always()
        run: |
          {
            echo "## Simple Voice Chat interoperability"
            echo "Server: Paper $MC with Simple Voice Chat ${SVC_VERSION:-?}"
            echo '```json'; cat svc-interop-result.json 2>/dev/null || echo '{"ok":false,"error":"no result"}'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -40 server/server.log || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: svc-interop-${{ env.MC }}
          path: |
            svc-interop-result.json
            probe.log
            mcvoice_*.log
            mcvoice_*.json
            svc-reconnect-result.json
            server/server.log
      - name: Stage diagnostic data
        if: always()
        run: |
          mkdir -p pub
          if [ -f svc-interop-result.json ]; then cp svc-interop-result.json pub/result.json; else echo '{"ok":false,"error":"no result"}' > pub/result.json; fi
          tail -c 200000 server/server.log > pub/server.log || true
          tail -c 200000 probe.log > pub/probe.log || true
          for f in mcvoice_*.log mcvoice_*.json svc-reconnect-result.json; do
            if [ -f "$f" ]; then tail -c 200000 "$f" > "pub/$f"; fi
          done
          printf '%s\n' "${SVC_VERSION:-?}" > pub/svc-version.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: svc-interop-diagnostic-data
          path: pub/

  diagnostics:
    needs: probe
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-diagnostics.yml
    with:
      artifact: svc-interop-diagnostic-data
      category: svc-interop
      minecraft: ${{ inputs.minecraft || '1.21.4' }}
