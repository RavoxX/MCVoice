name: backend

# Container images for both backends. Pushes to GHCR from main ("edge" + sha)
# and when called by release.yml (version tags; "latest" only for stable releases).

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (e.g. 0.1.0)
        required: true
        type: string
      latest:
        description: Also tag :latest
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        impl: [rust, go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}/voice-backend-${{ matrix.impl }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Compute tags
        id: tags
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.version }}" ]; then
            tags="$image:${{ inputs.version }}"
            if [ "${{ inputs.latest }}" = "true" ]; then tags="$tags,$image:latest"; fi
          else
            tags="$image:edge,$image:sha-${GITHUB_SHA::12}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.impl }}
          load: true
          tags: mcvoice-backend-${{ matrix.impl }}:test
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version || 'edge' }}
          cache-from: type=gha,scope=${{ matrix.impl }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.impl) || '' }}
      - name: Smoke test container
        run: |
          docker run -d --name be -p 18080:8080 -p 24455:24455/udp -e AUTH_MODE=offline -e PUBLIC_HOSTNAME=127.0.0.1 \
            mcvoice-backend-${{ matrix.impl }}:test
          for _ in $(seq 60); do curl -sf http://127.0.0.1:18080/ready && break; sleep 0.5; done
          curl -sf http://127.0.0.1:18080/health
          curl -sf http://127.0.0.1:18080/metrics | grep -q mcvoice_build_info
          docker run --rm --entrypoint /mcvoice-backend mcvoice-backend-${{ matrix.impl }}:test --version
          # images must not contain env files or sources
          docker create --name inspect mcvoice-backend-${{ matrix.impl }}:test >/dev/null
          docker export inspect | tar -t | grep -E '(^|/)\.env|\.go$|\.rs$' && { echo "::error::image contains sources or env files"; exit 1; } || true
          docker logs be | tail -5
      - name: Export tested image
        if: github.event_name != 'pull_request'
        run: docker save mcvoice-backend-${{ matrix.impl }}:test -o backend-image.tar
      - uses: actions/upload-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          name: backend-image-${{ matrix.impl }}
          path: backend-image.tar
          retention-days: 3

  publish:
    needs: image
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        impl: [rust, go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: backend-image-${{ matrix.impl }}
      - name: Load tested image (never execute it in this job)
        run: docker load -i backend-image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
          IMPL: ${{ matrix.impl }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/voice-backend-$IMPL"
          if [ -n "$VERSION" ]; then
            docker tag "mcvoice-backend-$IMPL:test" "$image:$VERSION"
            docker push "$image:$VERSION"
            if [ "$LATEST" = true ]; then docker tag "mcvoice-backend-$IMPL:test" "$image:latest"; docker push "$image:latest"; fi
          else
            for tag in edge "sha-${GITHUB_SHA::12}"; do docker tag "mcvoice-backend-$IMPL:test" "$image:$tag"; docker push "$image:$tag"; done
          fi
