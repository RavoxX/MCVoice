name: backend

# Container images for both backends. Pushes to GHCR from main ("edge" + sha)
# and when called by release.yml (version tags; "latest" only for stable releases).

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (e.g. 0.1.0)
        required: true
        type: string
      latest:
        description: Also tag :latest
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        impl: [rust, go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/voice-backend-${{ matrix.impl }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Compute tags
        id: tags
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.version }}" ]; then
            tags="$image:${{ inputs.version }}"
            if [ "${{ inputs.latest }}" = "true" ]; then tags="$tags,$image:latest"; fi
          else
            tags="$image:edge,$image:sha-${GITHUB_SHA::12}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.impl }}
          load: true
          tags: mcvoice-backend-${{ matrix.impl }}:test
          cache-from: type=gha,scope=${{ matrix.impl }}
          cache-to: type=gha,mode=max,scope=${{ matrix.impl }}
      - name: Smoke test container
        run: |
          docker run -d --name be -p 18080:8080 -p 24455:24455/udp -e AUTH_MODE=offline -e PUBLIC_HOSTNAME=127.0.0.1 \
            mcvoice-backend-${{ matrix.impl }}:test
          for _ in $(seq 60); do curl -sf http://127.0.0.1:18080/ready && break; sleep 0.5; done
          curl -sf http://127.0.0.1:18080/health
          curl -sf http://127.0.0.1:18080/metrics | grep -q mcvoice_build_info
          docker run --rm --entrypoint /mcvoice-backend mcvoice-backend-${{ matrix.impl }}:test --version
          # images must not contain env files or sources
          docker create --name inspect mcvoice-backend-${{ matrix.impl }}:test >/dev/null
          docker export inspect | tar -t | grep -E '(^|/)\.env|\.go$|\.rs$' && { echo "::error::image contains sources or env files"; exit 1; } || true
          docker logs be | tail -5
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.impl }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version || 'edge' }}
          cache-from: type=gha,scope=${{ matrix.impl }}
