name: mc-probe

# Developer tool for porting: prints the exact public API of Minecraft /
# loader classes for a given version so platform adapters can be written
# against real signatures. Uses the official client jar (unobfuscated 26.x) or
# Mojang's published client mappings (obfuscated 1.14.4-1.21.x).

on:
  workflow_dispatch:
    inputs:
      minecraft:
        description: Minecraft version
        required: true
      classes:
        description: Space-separated class names (mojmap), e.g. net.minecraft.client.Minecraft
        required: true
      jars:
        description: Space-separated maven URLs of extra jars to inspect (nested jars are unpacked)
        required: false
        default: ""
      jar_filter:
        description: Regex of classes to print from the extra jars
        required: false
        default: ""
      access:
        description: javap access filter (public or protected)
        required: false
        default: public
      libs:
        description: Regex of version.json library names to add to the classpath (e.g. authlib)
        required: false
        default: "authlib|brigadier|datafixerupper"
      mdk:
        description: Forge version (e.g. 26.3-66.0.3) whose MDK build files to print
        required: false
        default: ""
      search:
        description: Regex; list client-jar classes whose name matches (find renamed classes)
        required: false
        default: ""
      mappings:
        description: Regex grepped in mapping files (*.tiny, *.csv, *.srg) found in the extra jars/zips
        required: false
        default: ""
      fetch:
        description: Space-separated URLs of text files to print (maven metadata, build files)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Fetch Minecraft
        env:
          MC: ${{ inputs.minecraft }}
          LIBS: ${{ inputs.libs }}
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          curl -sSfL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o manifest.json
          url=$(jq -r --arg v "$MC" '.versions[] | select(.id==$v) | .url' manifest.json)
          curl -sSfL "$url" -o version.json
          curl -sSfL "$(jq -r .downloads.client.url version.json)" -o client.jar
          mapurl=$(jq -r '.downloads.client_mappings.url // empty' version.json)
          if [ -n "$mapurl" ]; then curl -sSfL "$mapurl" -o client.txt; fi
          mkdir -p libs
          jq -r --arg re "$LIBS" '.libraries[] | select(.name | test($re)) | .downloads.artifact.url' version.json | while read -r u; do
            [ -n "$u" ] && curl -sSfL "$u" -o "libs/$(basename "$u")"; done
          ls libs
          ls -la
      - name: Fetch text files
        if: always() && inputs.fetch != ''
        continue-on-error: true
        env:
          FETCH: ${{ inputs.fetch }}
        run: |
          exec > >(tee -a probe-output.txt) 2>&1
          for u in $FETCH; do echo "::group::URL $u"; curl -sSfL "$u" | head -c 60000 || echo "fetch failed: $u"; echo; echo "::endgroup::"; done
      - name: Search classes
        if: always() && inputs.search != ''
        continue-on-error: true
        env:
          SEARCH: ${{ inputs.search }}
        run: |
          cd work
          exec > >(tee -a ../probe-output.txt) 2>&1
          echo "### search $SEARCH"
          if [ -f client.txt ]; then grep -E '^[^ ].* -> ' client.txt | cut -d' ' -f1 | grep -E "$SEARCH" | head -300 || true
          else for j in client.jar libs/*.jar; do unzip -Z1 "$j"; done | grep '\.class$' | sed 's|\.class$||; s|/|.|g' | grep -E "$SEARCH" | head -300 || true; fi
          if [ -d extra ]; then :; fi
      - name: Print classes
        continue-on-error: true
        env:
          CLASSES: ${{ inputs.classes }}
          ACCESS: ${{ inputs.access }}
        run: |
          set -uo pipefail
          cd work
          exec > >(tee -a ../probe-output.txt) 2>&1
          for c in $CLASSES; do
            echo "::group::$c"
            if [ -f client.txt ]; then
              awk -v cls="$c" '
                /^[^ #]/ { inside = ($1 == cls) }
                inside { print }
              ' client.txt | sed 's/ -> [^ ]*$//; s/^\( *\)[0-9]*:[0-9]*:/\1/' | head -3000
              awk -v cls="$c" '/^[^ ]/ && $1 == cls {found=1} END {if (!found) print "NOT FOUND in mappings: " cls}' client.txt
            else
              javap -cp "client.jar:$(ls libs/*.jar 2>/dev/null | tr '\n' ':')" "-$ACCESS" "$c" 2>&1 | head -3000 || true
            fi
            echo "::endgroup::"
          done
      - name: Inspect extra jars
        if: always() && inputs.jars != ''
        continue-on-error: true
        env:
          JARS: ${{ inputs.jars }}
          FILTER: ${{ inputs.jar_filter }}
          MAPPINGS: ${{ inputs.mappings }}
        run: |
          set -uo pipefail
          cd work && mkdir -p extra && cd extra
          exec > >(tee -a ../../probe-output.txt) 2>&1
          set +e
          i=0
          for u in $JARS; do
            i=$((i+1)); curl -sSfL "$u" -o "j$i.jar" || { echo "download failed: $u"; continue; }
            echo "downloaded $u: $(file -b "j$i.jar") $(stat -c %s "j$i.jar") bytes"
            mkdir -p "x$i" && (cd "x$i" && unzip -q -o "../j$i.jar") || echo "unzip failed: $u"
            # unpack nested (jar-in-jar) modules
            find "x$i" -name '*.jar' | while read -r n; do d="${n%.jar}_x"; mkdir -p "$d"; (cd "$d" && unzip -q -o "$OLDPWD/$n"); done
          done
          if [ -n "$MAPPINGS" ]; then
            for m in $(find . -name '*.tiny'); do
              # tiny v2: print whole class blocks (fields/methods with named descriptors) for matching classes
              echo "::group::mappings $m"
              awk -v re="$MAPPINGS" -F'\t' '
                /^c\t/ { inside = ($NF ~ re); if (inside) print "CLASS " $2 " -> " $NF; next }
                inside && /^\t[mf]\t/ { print "  " $2 " " $3 " " $4 " -> " $NF }
              ' "$m" | head -3000
              echo "::endgroup::"
            done
            for m in $(find . -name '*.csv' -o -name '*.srg' -o -name '*.tsrg'); do
              echo "::group::mappings $m"; grep -E "$MAPPINGS" "$m" | head -400; echo "::endgroup::"
            done
          fi
          find . -name '*.class' | sed 's|^\./x[0-9]*/||; s|^.*_x/||; s|\.class$||; s|/|.|g' | grep -E "$FILTER" | sort -u | head -150 > classes.txt
          cat classes.txt
          while read -r c; do
            f=$(find . -path "*/$(echo "$c" | tr . /).class" | head -1)
            root=${f%/$(echo "$c" | tr . /).class}
            echo "::group::$c"; javap -cp "$root:../client.jar" -public "$c" 2>&1 | head -120; echo "::endgroup::"
          done < classes.txt
      - name: Forge MDK
        if: always() && inputs.mdk != ''
        continue-on-error: true
        env:
          MDK: ${{ inputs.mdk }}
        run: |
          set -uo pipefail
          exec > >(tee -a probe-output.txt) 2>&1
          mkdir -p mdk && cd mdk
          url="https://maven.minecraftforge.net/net/minecraftforge/forge/$MDK/forge-$MDK-mdk.zip"
          echo "### MDK $url"
          curl -sSfL "$url" -o mdk.zip || { echo "no MDK at $url"; exit 0; }
          unzip -q -o mdk.zip
          for f in $(find . -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' -o -name 'gradle-wrapper.properties' -o -name 'mods.toml' -o -name '*.java' -o -name 'pack.mcmeta' -o -name 'mcmod.info' | grep -v '/build/' | sort); do
            echo "::group::FILE $f"; cat "$f"; echo; echo "::endgroup::"
          done
      - name: Publish output to tooling/probe-output branch
        if: always()
        env:
          MC: ${{ inputs.minecraft }}
        run: |
          set -eu
          f=probe-output.txt; [ -f "$f" ] || exit 0
          git init -q out && cd out
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q origin tooling/probe-output 2>/dev/null; then git checkout -q -b tooling/probe-output FETCH_HEAD; else git checkout -q --orphan tooling/probe-output; fi
          mkdir -p "$MC"; cp "../$f" "$MC/${{ github.run_id }}.txt"; cp "../$f" "$MC/latest.txt"
          git add -A && git commit -q -m "probe $MC run ${{ github.run_id }}" && git push -q origin HEAD:tooling/probe-output
