name: mc-build
run-name: "mc-build ${{ inputs.minecraft || github.ref_name }}"

# Builds every implemented loader of one Minecraft version and validates the
# production jars. Runs on mc/<version> branches (which carry a generated
# minecraft/ directory) and on demand for any version from main (generating
# the build with tools/port-version/port.py first). The per-loader results are
# the only source of "supported" status (versions/build-status.json).

on:
  push:
    branches: ["mc/**"]
  workflow_dispatch:
    inputs:
      minecraft:
        description: Minecraft version (generate build with port.py)
        required: false
        default: ""
  workflow_call:
    inputs:
      minecraft:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      version:
        description: release version override (e.g. 0.1.0)
        required: false
        type: string
        default: ""
      publish:
        description: publish the Maven packages to GitHub Packages after a successful build
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mc-build-${{ github.ref }}-${{ inputs.minecraft }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      minecraft: ${{ steps.info.outputs.minecraft }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve target
        id: info
        env:
          MC: ${{ inputs.minecraft }}
        run: |
          set -euo pipefail
          # an mc/<version> branch carries its generated build: use it as committed when it matches
          have=$(python3 -c "import json;print(json.load(open('minecraft/build-info.json'))['minecraft'])" 2>/dev/null || true)
          if [ -z "$MC" ]; then MC="${have:-${GITHUB_REF_NAME#mc/}}"; fi
          if [ "$have" != "$MC" ]; then python3 tools/port-version/port.py "$MC"; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          b = json.load(open("minecraft/build-info.json"))
          print("minecraft=" + b["minecraft"])
          print("java=%d" % b["java"])
          print("jdks<<EOF\n" + "\n".join(str(j) for j in b["jdks"]) + "\nEOF")
          print("loaders=" + " ".join(b["loaders"]))
          print("gradle_jdks=" + " ".join("%s:%d" % (k, v["gradle_jdk"]) for k, v in b["builds"].items()))
          PY
          cat minecraft/build-info.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.info.outputs.jdks }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build loaders
        id: build
        working-directory: minecraft
        env:
          MOD_VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -uo pipefail
          mkdir -p ../dist ../status
          extra=""
          version=$(sed -n 's/^mod_version=//p' ../client/gradle.properties | tr -d '\r')
          if [ -n "$MOD_VERSION_OVERRIDE" ]; then extra="-Pmod_version=$MOD_VERSION_OVERRIDE"; fi
          if [ -n "$MOD_VERSION_OVERRIDE" ]; then version="$MOD_VERSION_OVERRIDE"; fi
          fail=0
          for spec in ${{ steps.info.outputs.gradle_jdks }}; do
            loader=${spec%%:*}; jdk=${spec##*:}
            home_var="JAVA_HOME_${jdk}_X64"; export JAVA_HOME="${!home_var}"
            echo "::group::build $loader (Gradle JVM $jdk: $JAVA_HOME)"
            ok=0
            (cd "$loader" && ./gradlew build --stacktrace --no-daemon $extra) 2>&1 | tee "../status/$loader.log" && ok=1
            # ForgeGradle 7's Mavenizer once failed recompiling its own decompiled Minecraft sources for a
            # version that built before and after: retry a failure while configuring the toolchain, once
            if [ $ok = 0 ] && grep -q "A problem occurred configuring root project" "../status/$loader.log"; then
              echo "::warning::$loader: build tool setup failed, retrying once"
              echo "=== retry: build tool setup failed ===" >> "../status/$loader.log"
              (cd "$loader" && ./gradlew build --stacktrace --no-daemon $extra) 2>&1 | tee -a "../status/$loader.log" && ok=1
            fi
            if [ $ok = 1 ]; then
              jar=$(ls "$loader"/build/libs/mcvoice-*-mc*-"$loader".jar 2>/dev/null | grep -v -- '-sources' | head -1)
              if [ -n "$jar" ] && python3 ../tools/port-version/validate_jar.py "$jar" --loader "$loader" \
                   --minecraft "${{ steps.info.outputs.minecraft }}" --java "${{ steps.info.outputs.java }}" --version "$version" | tee -a "../status/$loader.log"; then
                cp "$jar" ../dist/
                mkdir -p ../maven-inputs
                cp "$jar" ../maven-inputs/
                source=$(find "$loader/build/libs" -maxdepth 1 -name '*-sources.jar' ! -name '*-dev-sources.jar' | head -1)
                test -n "$source" && cp "$source" "../maven-inputs/$loader-sources.jar" || { echo "missing sources jar"; exit 1; }
                status=pass; reason=""; jarname=$(basename "$jar")
              else
                status=fail; reason="jar validation failed"; jarname=""; fail=1
              fi
            else
              status=fail; jarname=""; fail=1
              reason=$(grep -E "error:|FAILURE|What went wrong" -A2 "../status/$loader.log" | head -c 400 | tr '\n' ' ')
            fi
            echo "::endgroup::"
            python3 - "$loader" "$status" "$jarname" "$reason" <<'PY'
          import json, os, sys
          loader, status, jar, reason = sys.argv[1:5]
          r = {"minecraft": "${{ steps.info.outputs.minecraft }}", "loader": loader, "status": status,
               "run": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
               "commit": os.environ["GITHUB_SHA"]}
          if jar: r["jar"] = jar
          if reason: r["reason"] = reason
          json.dump(r, open(f"../status/{loader}.json", "w"))
          print(r)
          PY
          done
          (cd ../dist && sha256sum *.jar > checksums-sha256.txt || true)
          exit $fail
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mc-${{ steps.info.outputs.minecraft }}-jars
          path: dist/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: raw-mc-${{ steps.info.outputs.minecraft }}-results
          path: status/
      - uses: actions/upload-artifact@v5
        if: inputs.publish && steps.build.outcome == 'success'
        with:
          name: mc-${{ steps.info.outputs.minecraft }}-maven-inputs
          path: maven-inputs/

  maven:
    needs: build
    if: inputs.publish && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: actions/download-artifact@v5
        with:
          name: raw-mc-${{ needs.build.outputs.minecraft }}-results
          path: status
      - uses: actions/download-artifact@v5
        with:
          name: mc-${{ needs.build.outputs.minecraft }}-maven-inputs
          path: maven-inputs
      - name: Publish prebuilt artifacts only
        env:
          VERSION: ${{ inputs.version }}
          MC: ${{ needs.build.outputs.minecraft }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/release/publish-prebuilt.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: maven-mc-${{ needs.build.outputs.minecraft }}-results
          path: status/

  diagnostics:
    needs: [build, maven]
    if: always() && needs.build.outputs.minecraft != ''
    permissions:
      contents: write
    uses: ./.github/workflows/publish-diagnostics.yml
    with:
      artifact: raw-mc-${{ needs.build.outputs.minecraft }}-results
      supplement: ${{ inputs.publish && needs.build.result == 'success' && format('maven-mc-{0}-results', needs.build.outputs.minecraft) || '' }}
      publication_result: ${{ inputs.publish && needs.build.result == 'success' && needs.maven.result || '' }}
      category: builds
      minecraft: ${{ needs.build.outputs.minecraft }}
      final_artifact: mc-${{ needs.build.outputs.minecraft }}-status
