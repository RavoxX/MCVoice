name: mc-build
run-name: "mc-build ${{ inputs.minecraft || github.ref_name }}"

# Builds every implemented loader of one Minecraft version and validates the
# production jars. Runs on mc/<version> branches (which carry a generated
# minecraft/ directory) and on demand for any version from main (generating
# the build with tools/port-version/port.py first). The per-loader results are
# the only source of "supported" status (versions/build-status.json).

on:
  push:
    branches: ["mc/**"]
  workflow_dispatch:
    inputs:
      minecraft:
        description: Minecraft version (generate build with port.py)
        required: false
        default: ""
  workflow_call:
    inputs:
      minecraft:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      version:
        description: release version override (e.g. 0.1.0)
        required: false
        type: string
        default: ""
      publish:
        description: publish the Maven packages to GitHub Packages after a successful build
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mc-build-${{ github.ref }}-${{ inputs.minecraft }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish build logs to the tooling/probe-output branch
      packages: write   # Maven packages (release builds only, inputs.publish)
    outputs:
      minecraft: ${{ steps.info.outputs.minecraft }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve target
        id: info
        env:
          MC: ${{ inputs.minecraft }}
        run: |
          set -euo pipefail
          # an mc/<version> branch carries its generated build: use it as committed when it matches
          have=$(python3 -c "import json;print(json.load(open('minecraft/build-info.json'))['minecraft'])" 2>/dev/null || true)
          if [ -z "$MC" ]; then MC="${have:-${GITHUB_REF_NAME#mc/}}"; fi
          if [ "$have" != "$MC" ]; then python3 tools/port-version/port.py "$MC"; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          b = json.load(open("minecraft/build-info.json"))
          print("minecraft=" + b["minecraft"])
          print("java=%d" % b["java"])
          print("jdks<<EOF\n" + "\n".join(str(j) for j in b["jdks"]) + "\nEOF")
          print("loaders=" + " ".join(b["loaders"]))
          print("gradle_jdks=" + " ".join("%s:%d" % (k, v["gradle_jdk"]) for k, v in b["builds"].items()))
          PY
          cat minecraft/build-info.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.info.outputs.jdks }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build loaders
        id: build
        working-directory: minecraft
        env:
          MOD_VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -uo pipefail
          mkdir -p ../dist ../status
          extra=""
          if [ -n "$MOD_VERSION_OVERRIDE" ]; then extra="-Pmod_version=$MOD_VERSION_OVERRIDE"; fi
          fail=0
          for spec in ${{ steps.info.outputs.gradle_jdks }}; do
            loader=${spec%%:*}; jdk=${spec##*:}
            home_var="JAVA_HOME_${jdk}_X64"; export JAVA_HOME="${!home_var}"
            echo "::group::build $loader (Gradle JVM $jdk: $JAVA_HOME)"
            if (cd "$loader" && ./gradlew build --stacktrace --no-daemon $extra) 2>&1 | tee "../status/$loader.log"; then
              jar=$(ls "$loader"/build/libs/mcvoice-*-mc*-"$loader".jar 2>/dev/null | grep -v -- '-sources' | head -1)
              if [ -n "$jar" ] && python3 ../tools/port-version/validate_jar.py "$jar" --loader "$loader" \
                   --minecraft "${{ steps.info.outputs.minecraft }}" --java "${{ steps.info.outputs.java }}" | tee -a "../status/$loader.log"; then
                cp "$jar" ../dist/
                status=pass; reason=""; jarname=$(basename "$jar")
              else
                status=fail; reason="jar validation failed"; jarname=""; fail=1
              fi
            else
              status=fail; jarname=""; fail=1
              reason=$(grep -E "error:|FAILURE|What went wrong" -A2 "../status/$loader.log" | head -c 400 | tr '\n' ' ')
            fi
            echo "::endgroup::"
            python3 - "$loader" "$status" "$jarname" "$reason" <<'PY'
          import json, os, sys
          loader, status, jar, reason = sys.argv[1:5]
          r = {"minecraft": "${{ steps.info.outputs.minecraft }}", "loader": loader, "status": status,
               "run": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
               "commit": os.environ["GITHUB_SHA"]}
          if jar: r["jar"] = jar
          if reason: r["reason"] = reason
          json.dump(r, open(f"../status/{loader}.json", "w"))
          print(r)
          PY
          done
          (cd ../dist && sha256sum *.jar > checksums-sha256.txt || true)
          exit $fail
      - name: Publish Maven packages
        if: inputs.publish && steps.build.outcome == 'success'
        working-directory: minecraft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          MOD_VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -uo pipefail
          extra=""
          if [ -n "$MOD_VERSION_OVERRIDE" ]; then extra="-Pmod_version=$MOD_VERSION_OVERRIDE"; fi
          for spec in ${{ steps.info.outputs.gradle_jdks }}; do
            loader=${spec%%:*}; jdk=${spec##*:}
            home_var="JAVA_HOME_${jdk}_X64"; export JAVA_HOME="${!home_var}"
            if (cd "$loader" && ./gradlew publish --no-daemon $extra) > "../status/publish-$loader.log" 2>&1; then
              result=published
            else
              # never report success we did not get: keep the exact reason for the release report
              result="failed: $(grep -E 'Could not|status code|Received status|Forbidden|Unauthorized|error' "../status/publish-$loader.log" | head -3 | tr '\n' ' ' | head -c 300)"
            fi
            python3 - "$loader" "$result" <<'PY'
          import json, sys
          loader, result = sys.argv[1:3]
          p = f"../status/{loader}.json"
          r = json.load(open(p)); r["maven"] = result; json.dump(r, open(p, "w")); print(r)
          PY
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mc-${{ steps.info.outputs.minecraft }}-jars
          path: dist/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mc-${{ steps.info.outputs.minecraft }}-status
          path: status/
      - name: Publish build logs (developer diagnostics)
        if: always()
        env:
          MC: ${{ steps.info.outputs.minecraft }}
        run: |
          set -eu
          [ -d status ] || exit 0
          git init -q logs && cd logs
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q origin tooling/probe-output 2>/dev/null; then git checkout -q -b tooling/probe-output FETCH_HEAD; else git checkout -q --orphan tooling/probe-output; fi
          mkdir -p "builds/$MC"; rm -f "builds/$MC"/*
          for f in ../status/*; do tail -c 400000 "$f" > "builds/$MC/$(basename "$f")"; done
          git add -A && git commit -q -m "build logs $MC run ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do git push -q origin HEAD:tooling/probe-output && break; git fetch -q origin tooling/probe-output && git rebase -q FETCH_HEAD || true; done
